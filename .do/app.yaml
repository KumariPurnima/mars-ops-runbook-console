# App Platform spec for the MARS Ops Runbook console.
name: mars-ops-runbook-console
region: nyc

services:
  - name: console
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080

    git:
      repo_clone_url: https://github.com/KumariPurnima/mars-ops-runbook-console.git
      branch: main

    build_command: npm ci && npm run build
    run_command: npm start

    envs:
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: INFERENCE_MODEL
        scope: RUN_TIME
        value: deepseek-v4-pro
      - key: FORCE_REPLAY
        scope: RUN_TIME
        value: "0"

      - key: DO_API_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: DO_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: AGENT_CALLBACK_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME

      - key: MARS_TRIAGE_TRIGGER_ID
        scope: RUN_TIME
        value: REPLACE_ME
      - key: MARS_TRIAGE_TRIGGER_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: MARS_RUNBOOK_TRIGGER_ID
        scope: RUN_TIME
        value: REPLACE_ME
      - key: MARS_RUNBOOK_TRIGGER_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME

    health_check:
      http_path: /api/incidents
      initial_delay_seconds: 30
      period_seconds: 15
