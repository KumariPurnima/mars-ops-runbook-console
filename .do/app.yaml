name: mars-ops-runbook-console
region: nyc
services:
  - name: console
    github:
      repo: KumariPurnima/mars-ops-runbook-console
      branch: main
      deploy_on_push: true
    source_dir: /
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    build_command: npm ci && npm run build
    run_command: node .next/standalone/server.js
    envs:
      - key: DO_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: INFERENCE_MODEL
        scope: RUN_TIME
        value: openai-gpt-4.1
      - key: FORCE_REPLAY
        scope: RUN_TIME
        value: "0"
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
