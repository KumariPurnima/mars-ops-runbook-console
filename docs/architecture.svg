<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Architecture">
  <rect width="960" height="420" fill="#0b1018"/>
  <text x="40" y="42" fill="#eef3fa" font-family="ui-sans-serif,system-ui" font-size="18" font-weight="600">Ops Runbook Agent  architecture</text>
  <text x="40" y="66" fill="#95a4bd" font-family="ui-sans-serif,system-ui" font-size="13">Pager ’ Harness Runtime session ’ Serverless Inference ’ gated mitigation ’ postmortem</text>

  <rect x="40" y="100" width="160" height="72" rx="10" fill="#172033" stroke="#2a3450"/>
  <text x="120" y="132" text-anchor="middle" fill="#8ab4ff" font-family="ui-monospace,Menlo" font-size="12">Pager / Alert</text>
  <text x="120" y="152" text-anchor="middle" fill="#c3d0e3" font-family="ui-sans-serif,system-ui" font-size="12">board stand-in</text>

  <path d="M200 136 H250" stroke="#3c4a6b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="88" width="220" height="96" rx="10" fill="#172033" stroke="#0069ff"/>
  <text x="360" y="118" text-anchor="middle" fill="#eef3fa" font-family="ui-sans-serif,system-ui" font-size="13" font-weight="600">Harness Runtime</text>
  <text x="360" y="140" text-anchor="middle" fill="#95a4bd" font-family="ui-sans-serif,system-ui" font-size="12">Firecracker microVM</text>
  <text x="360" y="160" text-anchor="middle" fill="#95a4bd" font-family="ui-sans-serif,system-ui" font-size="12">durable session · pause/resume</text>

  <path d="M470 136 H520" stroke="#3c4a6b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="520" y="88" width="200" height="96" rx="10" fill="#172033" stroke="#6ee7a0"/>
  <text x="620" y="118" text-anchor="middle" fill="#eef3fa" font-family="ui-sans-serif,system-ui" font-size="13" font-weight="600">Serverless Inference</text>
  <text x="620" y="140" text-anchor="middle" fill="#95a4bd" font-family="ui-sans-serif,system-ui" font-size="12">inference.do-ai.run</text>
  <text x="620" y="160" text-anchor="middle" fill="#95a4bd" font-family="ui-sans-serif,system-ui" font-size="12">/v1/chat/completions</text>

  <path d="M720 136 H770" stroke="#3c4a6b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="770" y="100" width="150" height="72" rx="10" fill="#172033" stroke="#2a3450"/>
  <text x="845" y="132" text-anchor="middle" fill="#c9a8ff" font-family="ui-sans-serif,system-ui" font-size="12">Outcome</text>
  <text x="845" y="152" text-anchor="middle" fill="#c3d0e3" font-family="ui-sans-serif,system-ui" font-size="12">runbook · postmortem</text>

  <rect x="250" y="230" width="220" height="120" rx="10" fill="#111725" stroke="#2a3450"/>
  <text x="360" y="262" text-anchor="middle" fill="#8ab4ff" font-family="ui-sans-serif,system-ui" font-size="13" font-weight="600">Triage agent</text>
  <text x="360" y="286" text-anchor="middle" fill="#95a4bd" font-family="ui-sans-serif,system-ui" font-size="12">metrics · logs · deploys</text>
  <text x="360" y="308" text-anchor="middle" fill="#95a4bd" font-family="ui-sans-serif,system-ui" font-size="12">working diagnosis</text>
  <text x="360" y="330" text-anchor="middle" fill="#7f8fa9" font-family="ui-monospace,Menlo" font-size="11">agents/triage.yaml</text>

  <rect x="520" y="230" width="200" height="120" rx="10" fill="#111725" stroke="#2a3450"/>
  <text x="620" y="262" text-anchor="middle" fill="#c9a8ff" font-family="ui-sans-serif,system-ui" font-size="13" font-weight="600">Runbook agent</text>
  <text x="620" y="286" text-anchor="middle" fill="#95a4bd" font-family="ui-sans-serif,system-ui" font-size="12">gated mitigations</text>
  <text x="620" y="308" text-anchor="middle" fill="#95a4bd" font-family="ui-sans-serif,system-ui" font-size="12">status + postmortem</text>
  <text x="620" y="330" text-anchor="middle" fill="#7f8fa9" font-family="ui-monospace,Menlo" font-size="11">agents/runbook.yaml</text>

  <rect x="40" y="250" width="160" height="80" rx="10" fill="#111725" stroke="#f5cd7a"/>
  <text x="120" y="282" text-anchor="middle" fill="#f5cd7a" font-family="ui-sans-serif,system-ui" font-size="12" font-weight="600">Action Gateway</text>
  <text x="120" y="304" text-anchor="middle" fill="#c3d0e3" font-family="ui-sans-serif,system-ui" font-size="12">human approvals</text>

  <path d="M200 290 H250" stroke="#3c4a6b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M360 184 V230" stroke="#3c4a6b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M620 184 V230" stroke="#3c4a6b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="390" fill="#7f8fa9" font-family="ui-sans-serif,system-ui" font-size="12">Writes to production require approval. Destructive shell is denied. Humans still own the merge to reality.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3c4a6b"/>
    </marker>
  </defs>
</svg>
