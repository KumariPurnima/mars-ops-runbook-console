<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img">
  <title>Ops Runbook Agent architecture</title>
  <desc>Pager alert flows through the App Platform console into MARS Harness Runtime triage and runbook agents, Serverless Inference, Action Gateway approvals, and a gated outcome.</desc>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#5b6b8c"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#8ab4ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#6ee7a0"/>
    </marker>
  </defs>

  <rect width="1100" height="640" fill="#0b1018"/>
  <circle cx="980" cy="40" r="180" fill="#0069ff" fill-opacity="0.07"/>
  <circle cx="120" cy="560" r="160" fill="#6ee7a0" fill-opacity="0.05"/>

  <text x="48" y="48" fill="#eef3fa" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700">Ops Runbook Agent</text>
  <text x="48" y="76" fill="#95a4bd" font-family="Helvetica, Arial, sans-serif" font-size="14">Incident Copilot architecture - DigitalOcean MARS + Serverless Inference</text>

  <rect x="880" y="28" width="172" height="32" rx="16" fill="#12231a" stroke="#2f6b4a"/>
  <circle cx="900" cy="44" r="5" fill="#6ee7a0"/>
  <text x="914" y="49" fill="#6ee7a0" font-family="Menlo, Consolas, monospace" font-size="12">LIVE on App Platform</text>

  <text x="48" y="120" fill="#7f8fa9" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700">1 - SIGNAL</text>
  <text x="300" y="120" fill="#7f8fa9" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700">2 - CONSOLE</text>
  <text x="560" y="120" fill="#7f8fa9" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700">3 - MARS (HARNESS RUNTIME)</text>

  <rect x="48" y="136" width="200" height="110" rx="14" fill="#111725" stroke="#2a3450"/>
  <text x="148" y="172" text-anchor="middle" fill="#8ab4ff" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Pager / Alert</text>
  <text x="148" y="196" text-anchor="middle" fill="#c3d0e3" font-family="Helvetica, Arial, sans-serif" font-size="12">Incident board stand-in</text>
  <text x="148" y="216" text-anchor="middle" fill="#7f8fa9" font-family="Menlo, Consolas, monospace" font-size="11">INC-101 ... INC-105</text>

  <path d="M248 191 H292" stroke="#5b6b8c" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="136" width="220" height="110" rx="14" fill="#111725" stroke="#0069ff"/>
  <text x="410" y="168" text-anchor="middle" fill="#eef3fa" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700">App Platform console</text>
  <text x="410" y="192" text-anchor="middle" fill="#c3d0e3" font-family="Helvetica, Arial, sans-serif" font-size="12">Dispatch / live feed / outcome</text>
  <text x="410" y="214" text-anchor="middle" fill="#7f8fa9" font-family="Menlo, Consolas, monospace" font-size="11">lib/mars.ts + lib/consume.ts</text>

  <path d="M520 191 H556" stroke="#8ab4ff" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="560" y="128" width="492" height="300" rx="18" fill="#0f1624" stroke="#1e4f9a"/>
  <rect x="560" y="128" width="492" height="44" rx="18" fill="#132038"/>
  <rect x="560" y="156" width="492" height="16" fill="#132038"/>
  <text x="580" y="156" fill="#8ab4ff" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Harness Runtime - Firecracker microVMs - fresh webhook triggers</text>

  <rect x="584" y="192" width="210" height="140" rx="12" fill="#172033" stroke="#3c4a6b"/>
  <text x="689" y="222" text-anchor="middle" fill="#8ab4ff" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Triage agent</text>
  <text x="689" y="246" text-anchor="middle" fill="#c3d0e3" font-family="Helvetica, Arial, sans-serif" font-size="12">metrics / logs / deploys</text>
  <text x="689" y="268" text-anchor="middle" fill="#c3d0e3" font-family="Helvetica, Arial, sans-serif" font-size="12">working diagnosis</text>
  <text x="689" y="294" text-anchor="middle" fill="#7f8fa9" font-family="Menlo, Consolas, monospace" font-size="11">ops-incident-triage</text>
  <text x="689" y="314" text-anchor="middle" fill="#7f8fa9" font-family="Menlo, Consolas, monospace" font-size="11">agents/triage.yaml</text>

  <path d="M794 262 H826" stroke="#8ab4ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="810" y="250" text-anchor="middle" fill="#7f8fa9" font-family="Helvetica, Arial, sans-serif" font-size="10">chain</text>

  <rect x="830" y="192" width="198" height="140" rx="12" fill="#172033" stroke="#3c4a6b"/>
  <text x="929" y="222" text-anchor="middle" fill="#c9a8ff" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Runbook agent</text>
  <text x="929" y="246" text-anchor="middle" fill="#c3d0e3" font-family="Helvetica, Arial, sans-serif" font-size="12">gated mitigations</text>
  <text x="929" y="268" text-anchor="middle" fill="#c3d0e3" font-family="Helvetica, Arial, sans-serif" font-size="12">status + postmortem</text>
  <text x="929" y="294" text-anchor="middle" fill="#7f8fa9" font-family="Menlo, Consolas, monospace" font-size="11">ops-incident-runbook</text>
  <text x="929" y="314" text-anchor="middle" fill="#7f8fa9" font-family="Menlo, Consolas, monospace" font-size="11">agents/runbook.yaml</text>

  <rect x="584" y="352" width="444" height="56" rx="12" fill="#12231a" stroke="#2f6b4a"/>
  <text x="806" y="376" text-anchor="middle" fill="#6ee7a0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Gradient Serverless Inference</text>
  <text x="806" y="396" text-anchor="middle" fill="#95a4bd" font-family="Menlo, Consolas, monospace" font-size="11">inference.do-ai.run/v1/chat/completions - no GPUs to provision</text>

  <text x="48" y="470" fill="#7f8fa9" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700">4 - GOVERNANCE</text>
  <text x="380" y="470" fill="#7f8fa9" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700">5 - FEEDBACK</text>
  <text x="700" y="470" fill="#7f8fa9" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700">6 - OUTCOME</text>

  <rect x="48" y="486" width="280" height="96" rx="14" fill="#111725" stroke="#f5cd7a"/>
  <text x="188" y="522" text-anchor="middle" fill="#f5cd7a" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Action Gateway</text>
  <text x="188" y="546" text-anchor="middle" fill="#c3d0e3" font-family="Helvetica, Arial, sans-serif" font-size="12">Human approval for writes</text>
  <text x="188" y="566" text-anchor="middle" fill="#7f8fa9" font-family="Helvetica, Arial, sans-serif" font-size="12">Deny: rm -rf / secret mutates</text>

  <rect x="380" y="486" width="260" height="96" rx="14" fill="#111725" stroke="#2a3450"/>
  <text x="510" y="522" text-anchor="middle" fill="#8ab4ff" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Agent callback</text>
  <text x="510" y="546" text-anchor="middle" fill="#c3d0e3" font-family="Helvetica, Arial, sans-serif" font-size="12">POST /api/agent/callback</text>
  <text x="510" y="566" text-anchor="middle" fill="#7f8fa9" font-family="Menlo, Consolas, monospace" font-size="11">SSE event stream -&gt; live feed</text>

  <rect x="700" y="486" width="352" height="96" rx="14" fill="#111725" stroke="#6ee7a0"/>
  <text x="876" y="522" text-anchor="middle" fill="#6ee7a0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Outcome panel</text>
  <text x="876" y="546" text-anchor="middle" fill="#c3d0e3" font-family="Helvetica, Arial, sans-serif" font-size="12">Diagnosis / gated runbook / postmortem</text>
  <text x="876" y="566" text-anchor="middle" fill="#7f8fa9" font-family="Helvetica, Arial, sans-serif" font-size="12">Human still owns production changes</text>

  <path d="M689 428 V470" stroke="#5b6b8c" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M929 428 V486" stroke="#6ee7a0" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M806 408 V450 H510 V486" stroke="#5b6b8c" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <text x="48" y="620" fill="#7f8fa9" font-family="Helvetica, Arial, sans-serif" font-size="12">Flow: alert -&gt; dispatch webhook -&gt; triage sandbox -&gt; runbook sandbox -&gt; callback -&gt; approved mitigation. Serverless Inference powers reasoning inside each harness session.</text>
</svg>
